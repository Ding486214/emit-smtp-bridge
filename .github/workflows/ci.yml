name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (syntax check)
        run: pnpm run lint

      - name: Unit / smoke tests
        run: pnpm test

      - name: Verify server starts and listens
        env:
          EMIT_API_KEY: re_ci_dummy_key
          EMIT_SMTP_HOST: 127.0.0.1
          EMIT_SMTP_PORT: 2587
          EMIT_SMTP_USER: ci
          EMIT_SMTP_PASS: ci
        run: |
          node src/index.mjs &
          PID=$!
          for i in $(seq 1 30); do
            if node -e "const n=require('net');const s=n.connect({host:'127.0.0.1',port:2587},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then
              echo "server is up"; break
            fi
            sleep 1
          done
          kill $PID

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t emit-smtp-bridge:${{ github.sha }} .
      - name: Smoke test container
        env:
          EMIT_API_KEY: re_ci_dummy_key
        run: |
          docker run -d --name emit-test -p 2587:587 emit-smtp-bridge:${{ github.sha }}
          for i in $(seq 1 30); do
            if docker exec emit-test node -e "const n=require('net');const s=n.connect({host:'127.0.0.1',port:587},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then
              echo "container up"; break
            fi
            sleep 1
          done
          docker logs emit-test
          docker rm -f emit-test
